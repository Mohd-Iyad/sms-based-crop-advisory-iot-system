<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a3c34"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a3c34">
    System Block Diagram v2 — Voice-First Crop Advisory (Paddy, Bhatkal)
  </text>
  <text x="600" y="52" text-anchor="middle" font-size="11" fill="#666">
    State-change alerting — external APIs and delivery are only invoked when there is a NEW condition to report
  </text>

  <rect x="30" y="90" width="210" height="140" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="135" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Field Sensor Node</text>
  <text x="135" y="136" text-anchor="middle" font-size="10.5" fill="#333">ESP32-WROOM-32 DevKit</text>
  <text x="135" y="153" text-anchor="middle" font-size="10.5" fill="#333">DHT22 (Temp / Humidity)</text>
  <text x="135" y="170" text-anchor="middle" font-size="10.5" fill="#333">FC-28 Soil Moisture</text>
  <text x="135" y="187" text-anchor="middle" font-size="10.5" fill="#333">MH-RD Rain Plate + LM393 LDR</text>
  <text x="135" y="212" text-anchor="middle" font-size="10" fill="#888">device_id + sequence + X-Device-Key</text>

  <rect x="290" y="90" width="210" height="140" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="395" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">FastAPI Intake</text>
  <text x="395" y="138" text-anchor="middle" font-size="11" fill="#333">Device key check</text>
  <text x="395" y="157" text-anchor="middle" font-size="11" fill="#333">Input validation (ranges)</text>
  <text x="395" y="176" text-anchor="middle" font-size="11" fill="#333">Duplicate sequence rejection</text>
  <text x="395" y="195" text-anchor="middle" font-size="11" fill="#333">Backend computes days-since-sowing</text>

  <rect x="550" y="90" width="210" height="140" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="655" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Rule Engine</text>
  <text x="655" y="138" text-anchor="middle" font-size="11" fill="#333">Hysteresis moisture state</text>
  <text x="655" y="157" text-anchor="middle" font-size="11" fill="#333">Versioned fertilizer/harvest rules</text>
  <text x="655" y="176" text-anchor="middle" font-size="11" fill="#333">Sensor-fault detection (never fakes)</text>
  <text x="655" y="195" text-anchor="middle" font-size="10" fill="#888">→ alert codes (not text)</text>

  <rect x="810" y="90" width="200" height="140" rx="10" fill="#fdf3ea" stroke="#c98a3e" stroke-width="1.5"/>
  <text x="910" y="115" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a4a10">State Manager</text>
  <text x="910" y="138" text-anchor="middle" font-size="11" fill="#7a4a10">State-change detection</text>
  <text x="910" y="157" text-anchor="middle" font-size="11" fill="#7a4a10">Per-code cooldown timer</text>
  <text x="910" y="176" text-anchor="middle" font-size="11" fill="#7a4a10">Unchanged reading → NO alert</text>
  <text x="910" y="197" text-anchor="middle" font-size="10" fill="#a06424">(this is the anti-spam fix)</text>

  <rect x="290" y="290" width="210" height="110" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="395" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Context (only if alerting)</text>
  <text x="395" y="338" text-anchor="middle" font-size="11" fill="#333">Weather API (unavailable ≠ no rain)</text>
  <text x="395" y="357" text-anchor="middle" font-size="11" fill="#333">Mandi API (full record, no fallback key)</text>

  <rect x="550" y="290" width="210" height="110" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="655" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Message Planner</text>
  <text x="655" y="338" text-anchor="middle" font-size="11" fill="#333">Voice: alert codes → LLM (short)</text>
  <text x="655" y="357" text-anchor="middle" font-size="11" fill="#333">SMS: deterministic template (numbers)</text>

  <rect x="810" y="290" width="200" height="110" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="910" y="315" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Gemini (LLM)</text>
  <text x="910" y="338" text-anchor="middle" font-size="11" fill="#333">Sees alert codes ONLY</text>
  <text x="910" y="357" text-anchor="middle" font-size="10.5" fill="#333">never receives raw numbers</text>
  <text x="910" y="374" text-anchor="middle" font-size="10" fill="#888">(cannot hallucinate a figure it never had)</text>

  <rect x="550" y="470" width="230" height="90" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="665" y="495" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Twilio Delivery</text>
  <text x="665" y="518" text-anchor="middle" font-size="11" fill="#333">Voice call (short) — independent try/except</text>
  <text x="665" y="537" text-anchor="middle" font-size="11" fill="#333">SMS (detailed) — independent try/except</text>

  <rect x="850" y="470" width="200" height="90" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="950" y="500" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Farmer</text>
  <text x="950" y="522" text-anchor="middle" font-size="11" fill="#333">Basic / feature phone</text>
  <text x="950" y="540" text-anchor="middle" font-size="10" fill="#333">receives call + SMS</text>

  <rect x="30" y="470" width="200" height="90" rx="10" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.5"/>
  <text x="130" y="500" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a3c34">Live Dashboard</text>
  <text x="130" y="522" text-anchor="middle" font-size="11" fill="#333">GET /dashboard</text>
  <text x="130" y="540" text-anchor="middle" font-size="10" fill="#333">shows last snapshot + why</text>

  <line x1="240" y1="160" x2="285" y2="160" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="545" y2="160" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="160" x2="805" y2="160" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="230" x2="655" y2="285" stroke="#c98a3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="265" text-anchor="middle" font-size="10" fill="#c98a3e">new alerts only</text>
  <line x1="500" y1="345" x2="545" y2="345" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="345" x2="805" y2="345" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="400" x2="665" y2="465" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="515" x2="845" y2="515" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="230" x2="130" y2="465" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="330" y="440" text-anchor="middle" font-size="10" fill="#999">every reading (even no-alert ones)</text>
</svg>
